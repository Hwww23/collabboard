<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
  <h2>WebSocket Test</h2>
  <div id="log"></div>
  <script>
    const TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIiwiZW1haWwiOiJ0ZXN0QHRlc3QuY29tIiwiaWF0IjoxNzc3Mjg3Mzg3LCJleHAiOjE3NzczNzM3ODd9.j77YNF-pGctDgIMJu3hkVzvfwWwytCs3k3yKBGcNUb4"
    const BOARD_ID = 1

    const socket = new SockJS("http://localhost:8080/ws")
    const client = Stomp.over(socket)

    client.connect({}, function() {
      log("Connected!")

      // Subscribe to board events
      client.subscribe(`/topic/board/${BOARD_ID}`, function(msg) {
        log("Received: " + msg.body)
      })

      // Simulate moving a task after 2 seconds
      setTimeout(() => {
        client.send(
          `/app/board/${BOARD_ID}/move`,
          { token: TOKEN },
          JSON.stringify({ taskId: 1, targetColumnId: 3, newPosition: 0 })
        )
        log("Sent move task event")
      }, 2000)
    })

    function log(msg) {
      document.getElementById("log").innerHTML += "<p>" + msg + "</p>"
    }
  </script>
</body>
</html>
